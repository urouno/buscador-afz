<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador AFINAZONE</title>
  <meta name="description" content="Consulta de publicaciones, compatibilidades vehiculares y números de parte de AFINAZONE.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-name">AFINAZONE</span>
        <span class="brand-sub">Buscador de publicaciones</span>
      </div>
      <div class="data-status">
        <span id="status" class="status" aria-live="polite">Cargando datos…</span>
        <button id="refresh" class="btn btn-ghost btn-sm" type="button" title="Descargar de nuevo los datos de la hoja">Actualizar</button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="wrap">
    <nav class="tabs" role="tablist" aria-label="Tipo de búsqueda">
      <button class="tab" role="tab" id="tab-btn-pub" data-mode="pub" aria-selected="true" aria-controls="panel-pub">
        <span class="tab-n">1</span> Publicación
      </button>
      <button class="tab" role="tab" id="tab-btn-veh" data-mode="veh" aria-selected="false" aria-controls="panel-veh">
        <span class="tab-n">2</span> Vehículo
      </button>
      <button class="tab" role="tab" id="tab-btn-part" data-mode="part" aria-selected="false" aria-controls="panel-part">
        <span class="tab-n">3</span> Número de parte
      </button>
    </nav>

    <!-- 1. Publicación -->
    <section class="panel" id="panel-pub" role="tabpanel" aria-labelledby="tab-btn-pub">
      <label class="field-label" for="q-pub">Número de publicación</label>
      <div class="searchbox">
        <input id="q-pub" type="search" inputmode="text" autocomplete="off" spellcheck="false"
               placeholder="Ej. 748972582, MLM748972582 o la liga de la publicación">
        <button class="btn btn-icon" type="button" data-clear="q-pub" aria-label="Borrar">×</button>
      </div>
      <p class="hint">Busca en Mercado Libre y, si están capturados, en Amazon (ASIN), Web AFZ, Web OCF y venta directa.</p>
    </section>

    <!-- 2. Vehículo -->
    <section class="panel" id="panel-veh" role="tabpanel" aria-labelledby="tab-btn-veh" hidden>
      <div class="filters-slot" data-slot="veh"></div>
    </section>

    <!-- 3. Número de parte -->
    <section class="panel" id="panel-part" role="tabpanel" aria-labelledby="tab-btn-part" hidden>
      <label class="field-label" for="q-part">Número de parte</label>
      <div class="searchbox">
        <input id="q-part" type="search" list="part-list" autocomplete="off" spellcheck="false"
               placeholder="Ej. OMF-003  ·  varios separados por coma: OMF-001, OMJ-001">
        <button class="btn btn-icon" type="button" data-clear="q-part" aria-label="Borrar">×</button>
      </div>
      <datalist id="part-list"></datalist>
      <details class="catalog" id="part-catalog">
        <summary>Elegir de la lista de números de parte</summary>
        <div id="part-catalog-body" class="catalog-body"></div>
      </details>
      <details class="refine" id="part-refine">
        <summary>Limitar por vehículo <span id="part-refine-count" class="pill" hidden></span></summary>
        <div class="filters-slot" data-slot="part"></div>
      </details>
    </section>

    <!-- Filtros (se mueven entre la pestaña 2 y la 3) -->
    <template id="filters-template">
      <form class="filters" id="filters" autocomplete="off" onsubmit="return false">
        <div class="filters-grid">
          <label class="f f-year">
            <span>Año del vehículo</span>
            <input id="f-year" type="number" inputmode="numeric" min="1990" max="2100" step="1" placeholder="Ej. 2014">
          </label>
          <div class="f-selects"></div>
          <label class="f f-text">
            <span>Palabras en la descripción</span>
            <input id="f-text" type="search" placeholder="Ej. enfriador, motul, 7l">
          </label>
        </div>
        <div class="filters-foot">
          <label class="check"><input id="f-noyear" type="checkbox"> Incluir publicaciones sin años registrados (aceites)</label>
          <button class="btn btn-ghost btn-sm" type="button" id="f-clear">Limpiar filtros</button>
        </div>
      </form>
    </template>

    <div id="summary" class="summary" aria-live="polite"></div>
    <div id="results" class="results"></div>
    <div class="more-wrap"><button id="more" class="btn" type="button" hidden>Mostrar más</button></div>
  </main>

  <footer class="footer wrap">
    <details id="quality" class="quality" hidden>
      <summary>Calidad de datos de la hoja <span id="quality-count" class="pill"></span></summary>
      <div id="quality-body" class="quality-body"></div>
    </details>
    <p class="foot-note" id="foot-note"></p>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
